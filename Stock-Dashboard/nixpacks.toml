[phases.install]
cmds = ["npm install -g pnpm@10", "pnpm install --no-frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = ["pnpm --filter @workspace/db build", "pnpm --filter @workspace/api-zod build", "pnpm --filter @workspace/api-client-react build", "pnpm --filter @workspace/api-server build"]

[start]
cmd = "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
